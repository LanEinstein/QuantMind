[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantmind"
version = "0.1.0"
description = "QuantMind - AI-powered A-share quantitative trading system"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    # Agent orchestration
    "langgraph>=0.3,<1",
    # Local SQLite checkpointer for the agents_team graph (M-002). Pinned <4 so
    # it keeps langgraph-checkpoint at the 3.x line langgraph 0.6 requires
    # (sqlite-saver 3.1+ forces checkpoint>=4.1 which breaks langgraph 0.6).
    "langgraph-checkpoint-sqlite>=3,<3.1",
    "langchain-openai>=0.3,<1",
    # Database
    "motor>=3.6,<4",
    "redis>=5.2,<6",
    # Market data
    "tushare>=1.4,<2",     # Pro full-market scan layer (K-001 / R0 §6, SDK only)
    "adata>=2.5,<3",
    "akshare>=1.15,<2",
    "baostock>=0.8,<2",
    # Backtesting
    "backtrader>=1.9,<2",
    # Knowledge graph in-memory analysis view (Q-001; SQLite is the durable log)
    "networkx>=3.4,<4",
    # HTTP client
    "httpx>=0.28,<1",
    # Data processing
    "pandas>=2.2,<3",
    # HTML parsing
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
    # Scheduler
    "apscheduler>=3.10,<4",
    # Feishu / Lark integration (P0-2 / F-001)
    "lark-oapi>=1.5,<2",
    # lark-oapi 1.5.3's ws/client.py uses the legacy websockets client API
    # (websockets.connect / WebSocketClientProtocol / InvalidStatusCode). websockets
    # 14.0 made `connect` the new asyncio implementation; under 15.0.1 the inbound
    # WS receive loop silently dies with `'NoneType' object has no attribute 'send'`
    # (can send via HTTP API, cannot receive events). Pin to the last legacy line so
    # lark's long-connection event receiver works (U-D10 / P0-2).
    "websockets>=11,<14",
    # Configuration & validation
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    "ruamel.yaml>=0.18,<1",
    "filelock>=3.13,<4",
    # Logging
    "structlog>=24,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "TID"]

# X-018 layer 1 — Phase X module isolation (P2-2 §2 red line 17).
# Lints the seven decision-path subpackages so a contributor adding a
# ``from backend.api import ...`` line into a Phase X file sees a ruff
# error at edit time. The redline-check.sh + tests/test_phase_x_imports.py
# enforce the same rule at commit time and during pytest.
#
# NOTE: ruff TID251 is a global rule — it fires across the whole repo.
# A legitimate consumer of these subpackages (e.g. backend/api itself
# importing backend/api.router) imports BELOW the ``backend.api`` root
# so the rule's pattern matching only catches *cross-package* imports.
# Use ``noqa: TID251`` in legitimate inside-backend.api cross references
# if any surface (none currently exist).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"backend.api".msg = "Phase X modules must not import backend.api (P2-2 §2 red line 17)"
"backend.broker".msg = "Phase X modules must not import backend.broker (P2-2 §2 red line 17)"
"backend.risk".msg = "Phase X modules must not import backend.risk (P2-2 §2 red line 17)"
"backend.llm".msg = "Phase X modules must not import backend.llm (P2-2 §2 red line 17)"
"backend.agents".msg = "Phase X modules must not import backend.agents (P2-2 §2 red line 17)"
"backend.mirofish".msg = "Phase X modules must not import backend.mirofish (P2-2 §2 red line 17)"
"backend.data".msg = "Phase X modules must not import backend.data (P2-2 §2 red line 17)"

# The banned-api rule applies globally, but only Phase X files are
# the "real" target; relax it everywhere else so legitimate decision-path
# code (which imports these subpackages on purpose) keeps building.
# Phase X scope (rule remains active):
#   * backend/evolution/**/*.py
#   * backend/services/{prompt_registry, shadow_chain, exemplar_selector,
#     dspy_gepa_runner, evolution_dispatcher, amendment_drafter,
#     evolution_feishu_notifier, evolution_audit_writer}.py
# Anything else is allowed to import the 7 decision-path subpackages
# because it IS the decision path. Every non-Phase-X service file is
# enumerated below so a future Phase X service addition (e.g. when
# Q9 frontier->proposal Agent lands) is added implicitly by not being
# listed here.
[tool.ruff.lint.per-file-ignores]
"backend/api/**/*.py" = ["TID251"]
"backend/audit/**/*.py" = ["TID251"]
"backend/agents/**/*.py" = ["TID251"]
"backend/agents_team/**/*.py" = ["TID251"]
"backend/broker/**/*.py" = ["TID251"]
"backend/data/**/*.py" = ["TID251"]
"backend/integrations/**/*.py" = ["TID251"]
"backend/llm/**/*.py" = ["TID251"]
"backend/mirofish/**/*.py" = ["TID251"]
"backend/risk/**/*.py" = ["TID251"]
"backend/main.py" = ["TID251"]
"backend/services/acceptance_report.py" = ["TID251"]
"backend/services/analysis_stream.py" = ["TID251"]
"backend/services/config_service.py" = ["TID251"]
"backend/services/cost_guard.py" = ["TID251"]
"backend/services/cost_probe.py" = ["TID251"]
"backend/services/daily_state_assembler.py" = ["TID251"]
"backend/services/execution_report_parser.py" = ["TID251"]
"backend/services/fund_manager_output.py" = ["TID251"]
"backend/services/instruction_plan.py" = ["TID251"]
"backend/services/instruction_plan_builder.py" = ["TID251"]
"backend/services/instruction_state_machine.py" = ["TID251"]
"backend/services/ledger.py" = ["TID251"]
"backend/services/line1_context_provider.py" = ["TID251"]
"backend/services/line2_context_providers.py" = ["TID251"]
"backend/services/manual_trade_service.py" = ["TID251"]
"backend/services/mode_router.py" = ["TID251"]
"backend/services/mongo_repositories.py" = ["TID251"]
"backend/services/owner_authorization.py" = ["TID251"]
"backend/services/phase5b_exit_check.py" = ["TID251"]
"backend/services/reconciliation_parser.py" = ["TID251"]
"backend/services/reconciliation_state_machine.py" = ["TID251"]
"backend/services/reconciliation_threshold.py" = ["TID251"]
"backend/services/reset_trigger_detector.py" = ["TID251"]
"backend/services/rotation_context_provider.py" = ["TID251"]
"backend/services/run_mode.py" = ["TID251"]
"backend/services/secrets_validator.py" = ["TID251"]
"backend/services/shadow_compare.py" = ["TID251"]
"backend/services/shadow_recorder.py" = ["TID251"]
"backend/services/shadow_runner.py" = ["TID251"]
"backend/services/sim_reconciliation.py" = ["TID251"]
"backend/services/signal_evaluator.py" = ["TID251"]
"backend/services/simulation_executor.py" = ["TID251"]
"backend/services/smoke_check.py" = ["TID251"]
"backend/services/soft_degrade_manager.py" = ["TID251"]
"backend/services/watchlist_policy.py" = ["TID251"]
"scripts/**/*.py" = ["TID251"]
"tests/**/*.py" = ["TID251"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: browser-based end-to-end tests (require live frontend + backend)",
    "unit: isolated unit test",
    "integration: integration test touching external services",
]

[tool.mypy]
python_version = "3.11"
strict = true
