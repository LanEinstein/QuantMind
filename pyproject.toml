[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantmind"
version = "0.1.0"
description = "QuantMind - AI-powered A-share quantitative trading system"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    # Agent orchestration
    "langgraph>=0.3,<1",
    "langchain-openai>=0.3,<1",
    # Database
    "motor>=3.6,<4",
    "redis>=5.2,<6",
    # Market data
    "adata>=2.5,<3",
    "akshare>=1.15,<2",
    "baostock>=0.8,<2",
    # Backtesting
    "backtrader>=1.9,<2",
    # HTTP client
    "httpx>=0.28,<1",
    # Data processing
    "pandas>=2.2,<3",
    # HTML parsing
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
    # Scheduler
    "apscheduler>=3.10,<4",
    # Configuration & validation
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    # Logging
    "structlog>=24,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
