# QuantMind gitleaks config (P1-6 §1.3 / H-001).
#
# Targets the 8-credential pool locked by P1-6 + P0-2-amendment-2026-05-16:
#   LLM (3): DEEPSEEK_API_KEY / DASHSCOPE_API_KEY / MOONSHOT_API_KEY
#   Feishu (5): FEISHU_APP_ID / FEISHU_APP_SECRET / FEISHU_VERIFY_TOKEN /
#               FEISHU_ENCRYPT_KEY / FEISHU_ALERT_CHAT_ID
#
# Legacy custom-bot envs (FEISHU_CUSTOM_BOT_WEBHOOK_URL /
# FEISHU_CUSTOM_BOT_SIGN_SECRET) are intentionally NOT in the rule set —
# the amendment retired them, so any value in the repo is a hard fail
# under the generic ``feishu-app-secret`` / ``generic-api-key`` rule
# matches (32-hex / sk-... shapes).
#
# Updates: every credential rotation cycle re-examines the rule set; new
# providers added to the LLM pool must extend ``[[rules]]`` here (and the
# secrets_validator pool in lockstep). See
# ``docs/runbook/secrets-incident-response.md`` for the rotation process.

title = "QuantMind credential scan"

# Use the upstream rule pack as a starting point — keeps generic
# patterns (AWS keys, etc.) covered even though we only ship custom
# rules below. ``useDefault = true`` is the gitleaks idiom for this.
[extend]
useDefault = true

# --- LLM provider keys -----------------------------------------------

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek API key (sk- prefix)"
regex = '''(?i)deepseek[_-]?api[_-]?key\s*[:=]\s*['"]?sk-[A-Za-z0-9_\-]{16,}['"]?'''
keywords = ["DEEPSEEK_API_KEY", "deepseek_api_key"]

[[rules]]
id = "dashscope-api-key"
description = "Alibaba DashScope (Qwen) API key"
regex = '''(?i)dashscope[_-]?api[_-]?key\s*[:=]\s*['"]?sk-[A-Za-z0-9_\-]{16,}['"]?'''
keywords = ["DASHSCOPE_API_KEY", "dashscope_api_key"]

[[rules]]
id = "moonshot-api-key"
description = "Moonshot / Kimi API key"
regex = '''(?i)moonshot[_-]?api[_-]?key\s*[:=]\s*['"]?sk-[A-Za-z0-9_\-]{16,}['"]?'''
keywords = ["MOONSHOT_API_KEY", "moonshot_api_key"]

# --- Feishu self-built app credentials -------------------------------

[[rules]]
id = "feishu-app-id"
description = "Feishu self-built app ID (cli_ prefix)"
regex = '''cli_[A-Za-z0-9]{16}'''
keywords = ["FEISHU_APP_ID", "feishu_app_id", "cli_"]

[[rules]]
id = "feishu-app-secret"
description = "Feishu self-built app secret (32 alnum)"
regex = '''(?i)feishu[_-]?app[_-]?secret\s*[:=]\s*['"]?[A-Za-z0-9]{32}['"]?'''
keywords = ["FEISHU_APP_SECRET", "feishu_app_secret"]

[[rules]]
id = "feishu-verify-token"
description = "Feishu verify token (32 alnum)"
regex = '''(?i)feishu[_-]?verify[_-]?token\s*[:=]\s*['"]?[A-Za-z0-9]{32}['"]?'''
keywords = ["FEISHU_VERIFY_TOKEN", "feishu_verify_token"]

[[rules]]
id = "feishu-encrypt-key"
description = "Feishu encrypt key (32 alnum)"
regex = '''(?i)feishu[_-]?encrypt[_-]?key\s*[:=]\s*['"]?[A-Za-z0-9]{32}['"]?'''
keywords = ["FEISHU_ENCRYPT_KEY", "feishu_encrypt_key"]

[[rules]]
id = "feishu-alert-chat-id"
description = "Feishu alert open_chat_id (oc_ prefix + 32 alnum)"
regex = '''oc_[A-Za-z0-9]{32}'''
keywords = ["FEISHU_ALERT_CHAT_ID", "feishu_alert_chat_id", "oc_"]

# --- Allowlist -------------------------------------------------------
#
# Tight allowlist — codex review session #14 P1-4: a broad
# ``docs/.*\.md`` allowlist would silently shadow a real ``sk-...`` /
# ``cli_...`` accidentally pasted into an incident document. Two
# narrow controls only:
#
# 1. Regex allowlist for OBVIOUSLY non-real placeholder shapes (repeated
#    letters that cannot form a real credential). A real credential
#    would never be a single-character run.
# 2. Path allowlist limited to files that ONLY reference credential
#    NAMES (never values) — gated by file content shape, not directory.
#
# Anything not in either bucket is scanned normally. If a future incident
# doc legitimately quotes a redacted value, add a one-line file-specific
# entry — never a directory glob.

[allowlist]
description = "Sample/test values with characters that cannot form real credentials"
regexes = [
    # ``cli_`` + literal ``a`` repeats — every credential char identical
    # is impossible from any provider's randomness.
    '''cli_a{16}''',
    # ``oc_`` + single-letter repeats (unit-test chat id fixtures:
    # _VALID_CHAT uses ``f``; _ALERT_CHAT uses ``a``; _DECISION_CHAT
    # uses ``d``). Any real chat_id mixes alnum so cannot match.
    '''oc_[fadbcv]{32}''',
    # 32-char placeholders that are a single repeated letter.
    '''x{32}''',
    '''a{32}''',
    '''e{32}''',
    '''v{32}''',
    # ``sk-`` + single-letter run (test fixture only).
    '''sk-A{16,}''',
    '''sk-B{16,}''',
    # Markdown / docstring callout: ``${FEISHU_APP_ID}`` templated refs.
    '''\$\{[A-Z_]+\}''',
]
paths = [
    # The validator + test source intentionally references credential
    # names. The .gitleaks.toml itself must be allowlisted to prevent
    # self-flagging on the rule regexes.
    '''backend/services/secrets_validator\.py''',
    '''tests/test_secrets_validator\.py''',
    '''\.gitleaks\.toml''',
    # .env.example only carries comments documenting which env vars to
    # set in ~/.bashrc — no assignments (also enforced by
    # scripts/redline-check.sh).
    '''\.env\.example''',
]
