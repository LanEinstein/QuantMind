# QuantMind pre-commit config (P1-6 §1.3 / H-001).
#
# Two required hooks run on every commit; bypassing them (``--no-verify``) is a
# CLAUDE.md §3 red line:
#   1. gitleaks  — credential scan (P1-6 §1.3). The hook ID matches gitleaks'
#      upstream pre-commit definition so ``pre-commit autoupdate`` stays aligned.
#   2. redline-check — the repo's §2 red-line scanner (Sc1, production-hardening
#      2026-06-25). It was always meant to "gate CI / pre-commit" (per its own
#      header) but was never wired, so the 1700-line gate was manual-only and
#      silently bypassable. Now it runs every commit (pass_filenames=false /
#      always_run so it scans the whole tree regardless of the staged set).
#
# Local install (one-time):
#     pip install pre-commit
#     pre-commit install
#
# CI install (the same command runs in any container):
#     pre-commit run --all-files --show-diff-on-failure

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: gitleaks (QuantMind credential scan)
        args:
          - --redact
          - --no-banner
          - --config=.gitleaks.toml
  - repo: local
    hooks:
      - id: redline-check
        name: redline scanner (QuantMind §2 red lines)
        entry: bash scripts/redline-check.sh
        language: system
        pass_filenames: false
        always_run: true
