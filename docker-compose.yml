services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    # Bind to loopback only — there is no Mongo auth configured for the
    # evaluation deployment, so exposing 27017 to all interfaces would
    # let any host on the network read/write the trading database.
    ports:
      - "127.0.0.1:27017:27017"
    # Single-node replica set (E-001 / P1-2.A). broker_events +
    # broker_snapshots writes use multi-document transactions which
    # require Mongo to be running as a replica set member. The
    # application-side fence in MongoDBService.assert_replica_set raises
    # a fail-closed error on boot if ``hello.setName`` is missing, so
    # ``rs.initiate()`` must be run once per deploy/README.md §1.1
    # before the BrokerScheduler will start.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # Bootstrap-aware: a plain ping passes during the brief window
      # between container start and ``rs.initiate()``. The replica-set
      # gate lives in the application boot probe — keeping the docker
      # healthcheck lenient avoids the chicken-and-egg deadlock where
      # Mongo would be unhealthy until initialised but cannot be
      # initialised until healthy.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bind to loopback only — Redis runs without auth in the evaluation
    # profile.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Opt-in container backend. Evaluation period runs the backend under
    # systemd on the host so it can read LLM keys from an interactive shell
    # env file. To use this service instead, run:
    #   docker compose --profile container-backend up -d
    profiles: ["container-backend"]
    build: .
    restart: unless-stopped
    # Loopback-only per P1-6 §1.5 — never expose backend to the host LAN
    # or public; remote access goes through SSH tunnel.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      # Forward LLM keys from host shell (set in ~/.bashrc) into the container.
      # Keeps secrets out of project files while supporting docker-compose deploy.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is not set in host shell}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is not set in host shell}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:?MOONSHOT_API_KEY is not set in host shell}
    volumes:
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  redis_data:
