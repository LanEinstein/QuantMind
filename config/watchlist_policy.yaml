# config/watchlist_policy.yaml — P0-9 locked structure (v2)
#
# This file is the SINGLE SOURCE OF TRUTH for the watchlist universe,
# scheduling cadence, daily-instruction cap split, exclusion rules and
# direction limits. Every threshold below is runtime-immutable — see
# docs/decisions/P0-9-watchlist-scope-frequency-traditional-quant-primary-long-only.md
# §1.3 / §1.4 / §2.4 / §5 for the locked constants.
#
# Any change requires:
#   1. a new `docs/decisions/P0-9-amendment-{date}-{topic}.md` explaining
#      why the threshold moves and what risk it accepts;
#   2. `git diff config/watchlist_policy.yaml`;
#   3. a backend restart.
#
# `backend/api/watchlist*.py` only exposes GET endpoints (P0-9 §1.3 /
# P1-5 §2 redline 1) — runtime mutation is forbidden.
#
# Why v2: P0-9 added five locked sections on top of the v1 fast/slow
# split (watchlist composition, mandatory ETFs, exclusion rules, daily
# cap allocation, direction policy). `policy_version: 2` lets the loader
# reject v1 YAML loudly instead of silently dropping the new sections.

policy_version: 2
last_updated: 2026-05-12
locked_decision: P0-9

# ============================================================
# Scheduling buckets — sole fast/slow split sharing one process
# ============================================================
#
# `fast` runs four times per trading day for short-horizon technical
# checks; `slow` runs once at 09:00 for the full multi-Agent debate.
# `pipeline_timeout_seconds` is a hard upper bound enforced by
# `asyncio.wait_for` inside `AnalysisScheduler` — going over kills the
# run. Targets: fast p95 ≤ 8 min (480s) / slow p95 ≤ 15 min (900s).
fast:
  cron: "0 9,11,13,15 * * mon-fri"
  pipeline: fast_pipeline
  max_debate_rounds: 1
  pipeline_timeout_seconds: 480
  default_codes: []

slow:
  cron: "0 9 * * mon-fri"
  pipeline: slow_pipeline
  max_debate_rounds: 2
  pipeline_timeout_seconds: 900
  # P0-9 §1.2 mandatory ETF triplet (the only locked-by-name codes in
  # the 13-code universe). The remaining 10 individual codes
  # (沪主 4 / 深主 3 / 创业板 3) are owner picks and stay empty until
  # the user fills them in via amendment + restart (P0-9 §1.3).
  default_codes:
    - "510300"
    - "510500"
    - "159949"

# ============================================================
# Watchlist composition — total locked at 13 (10 stocks + 3 ETFs)
# ============================================================
watchlist:
  total_codes: 13
  composition:
    sh_main: 4    # 沪市主板个股
    sz_main: 3    # 深市主板个股
    chuangye: 3   # 创业板个股
    etf: 3        # 宽基 ETF
  default_category: slow

# ============================================================
# Mandatory ETFs — locked by code (P0-9 §1.2)
# ============================================================
#
# 行业 / 主题 / 跨境 / 商品 / 货币 ETF 永禁;扩容必走 amendment。
required_etfs:
  - code: "510300"
    name: "沪深300 ETF"
    tracking: "沪深300指数"
  - code: "510500"
    name: "中证500 ETF"
    tracking: "中证500指数"
  - code: "159949"
    name: "创业板50 ETF"
    tracking: "创业板50指数"

# ============================================================
# Exclusion rules — fail-closed in InstructionPlanBuilder 5th early-return
# ============================================================
#
# Enforced in `backend/services/instruction_plan_builder.py` (D-003) on
# top of P0-7 board whitelist / ST ban / limit-up-limit-down ban.
# Missing inputs (stock_meta=None / liquidity history < 20 days /
# limit_price=None) all degrade to HOLD — no optimistic fallback.
exclusion_rules:
  ipo_min_trading_days: 30
  sub_new_min_trading_days: 180
  min_avg_amount_20d_yuan: 200000000
  max_unit_price_yuan: 500.0

# ============================================================
# Daily instruction cap allocation (P0-9 §3 + P0-7 max_daily_new=5)
# ============================================================
#
# `total_daily_cap` mirrors RiskConfig.max_daily_new_instructions and
# splits into traditional (slow + fast) + event (MiroFish severity≥HIGH).
# After `reserved_cap_release_time`, the unused event cap slides to
# traditional (see decision §3.4 example).
cap_allocation:
  total_daily_cap: 5
  traditional_path_default_cap: 4
  event_path_reserved_cap: 1
  reserved_cap_release_time: "14:30"

# ============================================================
# Direction policy — strict long-only
# ============================================================
direction_policy:
  long_only: true
  forbidden_sides:
    - SHORT
    - COVER
    - MARGIN_BUY
    - REVERSE_REPO
    - ETF_SUBSCRIBE
    - ETF_REDEEM
  etf_arbitrage_enabled: false

# ============================================================
# Per-code overrides — move a code into the fast bucket
# ============================================================
#
# Codes not listed fall back to `watchlist.default_category` (slow).
# Overrides must reference codes that already exist in the watchlist
# (slow.default_codes ∪ fast.default_codes).
overrides: {}

# ============================================================
# Self-check constraints — load-time sanity (read-only mirror)
# ============================================================
constraints:
  watchlist_size_must_equal: 13
  watchlist_etf_count_must_equal: 3
  total_daily_cap_must_equal_p0_7: 5
  long_only_must_be_true: true
