# Broker configuration

active: mock  # mock / qmt / vnpy

mock:
  # P1-2.A-amendment-2026-06-14: low-budget profitability test. 100,000 →
  # 9,000. Changing this is an account lifecycle event (archive prior
  # broker_events+broker_snapshots → restart re-seeds from config →
  # go-live bakes the new baseline), NOT a bare edit — recovery.py uses
  # snapshot/event initial_capital when they exist. ¥9k < small_max_cash_yuan
  # (10,000) ⇒ SMALL budget tier: ETF concentration_exception unlocked +
  # low-price-stock single-lot; individual stocks still ≤15%. See
  # docs/decisions/P1-2.A-amendment-2026-06-14-initial-capital-9k-low-budget.md
  # (prior ¥100k Normal-tier amendment: P1-2.A-amendment-2026-05-25).
  initial_capital: 9000
  # P0-4-amendment-2026-05-27 §2.3: owner's real broker commission is
  # 万分之1.5 (0.00015), floored at min_commission (5 CNY), double-sided.
  # 0.0003 placeholder → 0.00015. Runtime-immutable (P1-2.C / P0-7 §2
  # redline 1): change = git diff + amendment + restart, NO hot-reload.
  commission_rate: 0.00015         # 0.015% (万分之1.5)
  stamp_tax_rate: 0.001            # 0.1% (sell only)
  slippage_bps: 2                  # Legacy fallback when board lookup misses
  min_commission: 5.0              # Min 5 CNY per trade

  # P1-2.C / E-003 — board-tiered slippage. All four entries are
  # required at runtime (BrokerConfig validator rejects missing keys);
  # change requires a P1-2.C amendment doc + restart, NO hot-reload.
  slippage_bps_by_board:
    sh_main: 1.5
    sz_main: 1.5
    chuangye: 3.5
    etf: 1.5

  # SZ-side 0.00341% transfer fee toggle. Default on; flip to false
  # only via amendment for backtests against pre-2022 trading rules.
  enable_transfer_fee: true

qmt:
  enabled: false
  # Configure via environment variables

vnpy:
  enabled: false
  # Configure via environment variables
