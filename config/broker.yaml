# Broker configuration

active: mock  # mock / qmt / vnpy

mock:
  # P1-2.A-amendment-2026-06-16: 9,000 → 30,000 for the simulation_auto
  # profitability test. At ¥9k the 0.33 deploy envelope ÷ 5 names ≈ ¥594 <
  # one 100-share lot of the selected ¥6–8 names → 0 lots → no trades →
  # profitability unmeasurable. ¥30k ≥ small_max_cash_yuan (10,000) ⇒ NORMAL
  # budget tier (三连 caps: single ≤15% / total ≤70% / single-instr ≤¥5万);
  # deployable ≈ ¥9.9k ÷ 5 ≈ ¥1.98k/name → 2–3 lots/name → trades.
  # Changing this is an account lifecycle event (archive prior
  # broker_events+broker_snapshots → restart re-seeds from config), NOT a bare
  # edit — recovery.py uses snapshot/event initial_capital when they exist. See
  # docs/decisions/P1-2.A-amendment-2026-06-16-sim-capital-30k-for-profitability-test.md
  # (parks P1-2.A-amendment-2026-06-14 ¥9k low-budget). Real-money feishu
  # account capital is a separate future decision.
  initial_capital: 30000
  # P0-4-amendment-2026-05-27 §2.3: owner's real broker commission is
  # 万分之1.5 (0.00015), floored at min_commission (5 CNY), double-sided.
  # 0.0003 placeholder → 0.00015. Runtime-immutable (P1-2.C / P0-7 §2
  # redline 1): change = git diff + amendment + restart, NO hot-reload.
  commission_rate: 0.00015         # 0.015% (万分之1.5)
  stamp_tax_rate: 0.001            # 0.1% (sell only)
  slippage_bps: 2                  # Legacy fallback when board lookup misses
  min_commission: 5.0              # Min 5 CNY per trade

  # P1-2.C / E-003 — board-tiered slippage. All four entries are
  # required at runtime (BrokerConfig validator rejects missing keys);
  # change requires a P1-2.C amendment doc + restart, NO hot-reload.
  slippage_bps_by_board:
    sh_main: 1.5
    sz_main: 1.5
    chuangye: 3.5
    etf: 1.5

  # SZ-side 0.00341% transfer fee toggle. Default on; flip to false
  # only via amendment for backtests against pre-2022 trading rules.
  enable_transfer_fee: true

qmt:
  enabled: false
  # Configure via environment variables

vnpy:
  enabled: false
  # Configure via environment variables
