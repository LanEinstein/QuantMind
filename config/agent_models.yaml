# config/agent_models.yaml — LLM Router core configuration
# Blueprint V3 §2.2 + Phase 5B §2.8 (per-agent thinking/routing)

providers:
  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    default_model: "deepseek-v4-pro"
  qwen:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "${DASHSCOPE_API_KEY}"
    default_model: "qwen3.6-plus"
  kimi:
    base_url: "https://api.moonshot.cn/v1"
    api_key: "${MOONSHOT_API_KEY}"
    default_model: "kimi-k2.6"
  # --- Reserved for future expansion ---
  # claude:
  #   base_url: "https://api.anthropic.com/v1"
  #   api_key: "${CLAUDE_API_KEY}"
  #   default_model: "claude-sonnet-4-6"
  # openai:
  #   base_url: "https://api.openai.com/v1"
  #   api_key: "${OPENAI_API_KEY}"
  #   default_model: "gpt-4o"

defaults:
  temperature: 0.3
  max_tokens: 4096

# Per-agent thinking config (Phase 5B §2.8):
#   - "disabled" pairs with cheap-summary agents (deepseek/qwen) — drops
#     reasoning_content, saves output budget.
#   - "enabled" only meaningful for Kimi K2.x; max_tokens caps the
#     reasoning_content portion (separate from completion max_tokens).
#   - keep ∈ {all, last_round, none}: which rounds' reasoning to retain
#     in subsequent turns of the same conversation (consumed by P5B-T03).
agents:
  # P0-10-amendment-2026-06-11: the crawler/summary tier moves to
  # deepseek-v4-flash (¥1/¥2 per M — the cheap high-throughput tier;
  # v4-pro at ¥3/¥6 is reserved for reasoning-grade work).
  news_crawler:
    name: "新闻爬取员"
    provider: deepseek
    model: deepseek-v4-flash
    fallback: { provider: qwen, model: qwen3.6-plus }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "every_5min"
    task: "财经新闻摘要、分类、重要性评分(0-10)"

  sentiment_analyst:
    name: "情绪分析师"
    provider: deepseek
    model: deepseek-v4-flash
    fallback: { provider: qwen, model: qwen3.6-plus }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "every_30min"
    task: "社交媒体情绪、论坛情感、恐慌贪婪指数"

  data_cleaner:
    name: "数据清洗员"
    provider: deepseek
    model: deepseek-v4-flash
    fallback: { provider: qwen, model: qwen3.6-plus }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "realtime"
    task: "原始数据标准化、异常值标记、格式转换"

  # P0-10-amendment-2026-06-11: specialization routing — fundamental /
  # risk_officer stay on qwen3.6-plus (Chinese A-share domain strength);
  # technical_analyst moves to deepseek-v4-pro (numeric/indicator
  # reasoning — LiveCodeBench + Terminal-Bench leader — at half
  # qwen3.6-plus's output price).
  fundamental_analyst:
    name: "基本面分析师"
    provider: qwen
    model: qwen3.6-plus
    fallback: { provider: deepseek, model: deepseek-v4-pro }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "daily_or_event"
    task: "财报解读、PE/PB估值、行业对比"

  technical_analyst:
    name: "技术分析师"
    provider: deepseek
    model: deepseek-v4-pro
    fallback: { provider: qwen, model: qwen3.6-plus }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "daily"
    task: "K线形态、MACD/RSI/布林带、趋势判断"

  # Kimi-using agents (Phase 5B §2.8 tiered routing):
  #
  # IMPORTANT — tiered routing only applies where the agent prompt
  # produces a JSON envelope with a top-level numeric ``confidence`` field
  # in [0, 1]. The prose-only researchers (intelligence/bull/bear/risk)
  # currently emit free-form Chinese reports — running them through a
  # ``confidence_lt`` gate would force ``parse_failed`` on every triage
  # answer and turn the supposed cost saver into a 2x cost amplifier.
  #
  # T03 therefore enables tiered routing ONLY on ``fund_manager`` (the
  # single agent whose prompt enforces a JSON contract with confidence).
  # Extending routing to the prose agents is tracked as a follow-up:
  # update their prompts to a JSON contract (and downstream parsers)
  # before flipping the YAML.
  intelligence_officer:
    name: "情报研判员（含MiroFish）"
    provider: kimi
    model: kimi-k2.6
    fallback: { provider: qwen, model: qwen3.6-plus }
    thinking:
      type: enabled
      max_tokens: 10000
      keep: last_round
    frequency: "event_triggered"
    task: "信息融合、隐性变量推演、驱动MiroFish仿真"

  bull_researcher:
    name: "看多研究员"
    provider: kimi
    model: kimi-k2.6
    fallback: { provider: qwen, model: qwen3.6-plus }
    thinking:
      type: enabled
      max_tokens: 8000
      keep: all
    frequency: "per_trading_day"
    task: "构建看多论点、寻找上涨催化剂"

  bear_researcher:
    name: "看空研究员"
    provider: kimi
    model: kimi-k2.6
    fallback: { provider: qwen, model: qwen3.6-plus }
    thinking:
      type: enabled
      max_tokens: 8000
      keep: all
    frequency: "per_trading_day"
    task: "构建看空论点、寻找下跌风险"

  # risk_officer + fund_manager: see the specialization-routing note above
  # fundamental_analyst (P0-10-amendment-2026-06-11). History: the 05-25
  # amendment routed all 4 mandatory agents to qwen for the MVP go-live
  # and dropped fund_manager's routing block (shadow_baseline proves a
  # routing-less block is valid); 06-11 keeps both of these on qwen.
  risk_officer:
    name: "风控官"
    provider: qwen
    model: qwen3.6-plus
    fallback: { provider: deepseek, model: deepseek-v4-pro }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "per_trading_day"
    task: "投组风险评估、仓位建议、否决权"

  fund_manager:
    name: "基金经理（终局决策）"
    provider: qwen
    model: qwen3.7-max
    fallback: { provider: deepseek, model: deepseek-v4-pro }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "per_trading_day"
    task: "综合所有Agent报告，输出最终买卖信号"

  # ≥2 交易员 agent (T-001/T-002, P0-10-amendment-2026-05-24 §2.1/§2.4):
  # advisory-only 文本建议 (何时买/买多少倾向), 喂给 fund_manager 审议; 永不倡议
  # 方向 (fund_manager 唯一), 永不输出 volume/price (builder 确定性派生, 单一构造
  # 点不破). thinking disabled (自由文本, 无 JSON confidence 契约 → 不做分层路由).
  # 模型分工镜像分析师: momentum=deepseek-v4-pro (动量/趋势/价量数值) /
  # mean_reversion=qwen3.6-plus (估值偏离/安全边际). 路由 runtime 不可改 + 重启生效.
  trader_momentum:
    name: "动量交易员"
    provider: deepseek
    model: deepseek-v4-pro
    fallback: { provider: qwen, model: qwen3.6-plus }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "per_trading_day"
    task: "动量/趋势/入场时点建议(advisory文本，永不写方向/数量/价格)"

  trader_mean_reversion:
    name: "均值回归交易员"
    provider: qwen
    model: qwen3.6-plus
    fallback: { provider: deepseek, model: deepseek-v4-pro }
    thinking:
      type: disabled
      max_tokens: 0
      keep: none
    frequency: "per_trading_day"
    task: "均值回归/估值偏离/仓位管理建议(advisory文本，永不写方向/数量/价格)"

  # P0-10-amendment-2026-06-11: dedicated entries for the two
  # reasoning-heavy seams, decoupled from ``intelligence_officer`` (which
  # the legacy 9-agent pipeline + MiroFish keep sharing). Both run on
  # kimi-k2.6 with thinking — long-context evidence synthesis is its
  # strength. Spend is bounded by upstream call-count caps (thesis review
  # ≤10/day dedup'd; theme research 1 run/day ≤40k tokens) plus the ¥100/day
  # true reservation — NOT by the kimi ¥4/day cap, which the router only
  # enforces on the (currently unused) escalation rung; the shared
  # provider-keyed kimi counter may legitimately read > ¥4 on heavy days
  # because the legacy kimi trio bills the same bucket (owner accepted,
  # amendment §6).
  thesis_reviewer:
    name: "持仓复盘分析师（Phase W 盘后 thesis advisory）"
    provider: kimi
    model: kimi-k2.6
    fallback: { provider: qwen, model: qwen3.7-max }
    thinking:
      type: enabled
      max_tokens: 8000
      keep: none
    frequency: "per_trading_day_eod"
    task: "对比当前证据与持仓原始买入逻辑支柱,评估 thesis 健康度(evidence-only,严禁买卖建议)"

  theme_investigator:
    name: "产业链倒推调查员（Phase Y theme research SOP）"
    provider: kimi
    model: kimi-k2.6
    # No fallback by design: the investigator is fail-closed — an LLM
    # failure becomes an auditable aborted run and the pure-quant
    # pipeline runs unchanged (P0-8-amendment-2026-06-01 §3.6).
    thinking:
      type: enabled
      max_tokens: 10000
      keep: none
    frequency: "preopen_scheduled"
    task: "5 步产业链倒推 SOP 调查(定时·留痕·人工 pin 的 peer-sourcing;sourcing-only 无决策字段)"

  # Phase 5B exit shadow-test baseline (consumed only by
  # backend.services.shadow_runner when QUANTMIND_SHADOW_ENABLED=1).
  # Identical to fund_manager EXCEPT the routing block is intentionally
  # absent — this leg always calls Kimi directly so we can compare the
  # tiered-routing decision against the original kimi-only baseline.
  fund_manager_shadow_baseline:
    name: "基金经理 (Shadow Baseline / Kimi-only)"
    provider: kimi
    model: kimi-k2.6
    fallback: { provider: deepseek, model: deepseek-v4-pro }
    thinking:
      type: enabled
      max_tokens: 8000
      keep: last_round
    frequency: "shadow_only"
    task: "Phase 5B 出口 7-day shadow window 的 baseline leg；仅在 shadow_runner 启用时被调用，永远不进入实盘决策路径"
