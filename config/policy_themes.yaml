#  * 防 hindsight:`effective_from` = 宣示该主题的政策文件**公开发布日**;tilt 只从该日起生效。
#    路线 B = 长期国家战略主线用历史确立日(回测可验证『跟主旋律择场』),十五五作强化延续。
#  * 成分 PIT:只走申万 `index_member_all` 的 L3 in/out date(312 个 L3);`ths_index` 非 PIT 不用作成分。
#  * 排除未来产业(量子/核聚变/脑机/6G/纯具身智能 = 无盈利可估值的炒作)——by construction 不入本映射。
#  * 红线:科创 688 / 北交 8 / ST / 可转债仍由 universe 层永禁(本映射不放行,只标 L3 行业归属)。
#  * tier(driver 强度,复用 ThemeTier 1.0/0.75/0.5/0.25 + 单调钳制):
