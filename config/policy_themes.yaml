# ⚠️ DRAFT — 待 owner 确认主题清单 + 政策发布日,确认后由 owner 冻结(关键人工 gate)。
#    `status: draft` 时本映射**不参与任何 live/研究判定**(registry 载入但 resolver
#    消费方须显式 opt-in);owner 改 `status: frozen` + 走专门 codex PIT-soundness 门后生效。
