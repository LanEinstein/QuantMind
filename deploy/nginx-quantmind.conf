# nginx site for QuantMind (evaluation period, local HTTPS via mkcert).
#
# Installation:
#   sudo cp deploy/nginx-quantmind.conf /etc/nginx/sites-available/quantmind
#   sudo ln -sf /etc/nginx/sites-available/quantmind /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream quantmind_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

# Rate-limit analysis-job creation: each /jobs request fires the full
# 9-agent pipeline (8-12 LLM calls). 6 r/m per IP gives an operator
# room to retry while bounding what a bot can spend per minute.
limit_req_zone $binary_remote_addr zone=quantmind_jobs:10m rate=6r/m;

# Limit concurrent SSE streams per IP. The frontend opens at most one
# at a time; >5 means a misbehaving client.
limit_conn_zone $binary_remote_addr zone=quantmind_streams:10m;

# HTTP redirect → HTTPS. Loopback-only per P1-6 §1.5 — remote access goes
# through SSH tunnel; nginx never listens on a public interface.
server {
    listen 127.0.0.1:80;
    server_name quantmind.local;
    return 301 https://$host$request_uri;
}

server {
    # Legacy-compatible http2 enable: works on nginx >= 1.9.5. On nginx
    # >= 1.25 you may switch to `http2 on;` as a standalone directive.
    # Loopback-only per P1-6 §1.5 (see HTTP block above).
    listen 127.0.0.1:443 ssl http2;
    server_name quantmind.local;

    # mkcert-issued local certs; regenerate with:
    #   sudo mkcert -cert-file /etc/ssl/quantmind/quantmind.local.crt \
    #               -key-file /etc/ssl/quantmind/quantmind.local.key \
    #               quantmind.local localhost 127.0.0.1
    ssl_certificate     /etc/ssl/quantmind/quantmind.local.crt;
    ssl_certificate_key /etc/ssl/quantmind/quantmind.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Don't leak server version
    server_tokens off;

    # Security headers — applied to every response (static + API + SSE).
    # HSTS is fine for the local mkcert-trusted hostname; switch to
    # `max-age=31536000; includeSubDomains; preload` if/when this is
    # served from a real public origin.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Frontend static (built via `npm run build`) ---
    root /home/ps/papers/QuantMind/frontend/dist;
    index index.html;

    # Long-cache hashed asset bundles
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback — Vue router handles deep links
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API reverse proxy ---
    location /api/ {
        proxy_pass http://quantmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Tighter rate limit on the LLM-heavy job creation endpoint.
    location = /api/analysis/jobs {
        limit_req zone=quantmind_jobs burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://quantmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Manual watchlist analysis is a synchronous operator action that
    # serially runs the LLM pipeline for every active watchlist stock.
    # Keep this separate from generic /api/ so nginx does not return a
    # 504 while the backend is still working through providers.
    location = /api/watchlist/analyze-now {
        proxy_pass http://quantmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ^~ /api/watchlist/analyze/ {
        proxy_pass http://quantmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- SSE: agent analysis live stream ---
    # Buffering MUST be off, otherwise the nginx proxy holds chunks until
    # the response is closed and the browser sees a single big dump rather
    # than per-agent events. proxy_read_timeout is raised so a 2-minute
    # LLM pipeline doesn't drop the connection.
    location ~ ^/api/analysis/stream/ {
        # Cap concurrent open streams per remote IP — frontend uses one
        # EventSource at a time; >3 is a sign of a runaway client.
        limit_conn quantmind_streams 3;
        limit_conn_status 429;
        proxy_pass http://quantmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # --- WebSocket (real-time market data) ---
    location /ws/ {
        proxy_pass http://quantmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Upload cap — reject anything large at the edge so the backend
    # never has to parse a 50MB JSON body.
    client_max_body_size 2m;
}
